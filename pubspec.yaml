name: mise
description: "Recipe finder demo: live API, offline favorites and a step-by-step cook mode."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  google_fonts: ^8.2.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Pinned below 4.x: freezed 4 stable requires Dart >=3.13.
  freezed: ^4.0.1
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Bundled so text never waits on (or leaks visits to) fonts.gstatic.com.
    - assets/google_fonts/

# App icon: the author's dog. Edit tool/icon/mise.svg, then run
# tool/icon/render.sh to redraw the PNGs and regenerate these.
flutter_launcher_icons:
  image_path: tool/icon/full.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#D9532B"
  adaptive_icon_foreground: tool/icon/fg.png
  web:
    generate: true
    image_path: tool/icon/full.png
    background_color: "#F7F1E8"
    theme_color: "#D9532B"
